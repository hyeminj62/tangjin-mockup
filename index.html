<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 배우자는 탕진잼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --pink:#ff5c93; --pink-soft:#ffe3ec; --navy:#14275a; --navy-soft:#e8ecf6;
  --gray:#8a8f99; --line:#e6e8ee;
  --font:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#e9ecf3;font-family:var(--font);color:var(--navy)}
body{display:flex;align-items:center;justify-content:center}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ===== 폰 프레임 ===== */
.phone{
  position:relative;width:390px;height:844px;flex:none;overflow:hidden;
  background:#fff;border-radius:44px;border:10px solid #1b1d24;
  box-shadow:0 24px 60px rgba(20,39,90,.28);
  transform-origin:center center;
  /* border 포함 크기가 390x844가 되도록 */
  box-sizing:content-box;
}
@media (max-width:430px){
  html,body{background:#fff}
  .phone{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none;transform:none!important}
}

/* ===== 화면 / 전환 ===== */
.stage{position:absolute;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow:hidden;opacity:0}
.screen.in-fwd{animation:inFwd .35s ease forwards}
.screen.in-back{animation:inBack .35s ease forwards}
.screen.in-fade{animation:inFade .3s ease forwards}
.screen.out{animation:outFade .35s ease forwards;pointer-events:none}
.screen.no-anim{opacity:1}
@keyframes inFwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes outFade{from{opacity:1}to{opacity:0}}

/* ===== 이미지 / 플레이스홀더 ===== */
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.bg.blur{filter:blur(7px);transform:scale(1.08)}
.ph,.char.ph,.bg.ph{
  display:flex;align-items:center;justify-content:center;text-align:center;
  background:#cfd2d9;color:#555a66;font-size:11px;line-height:1.4;word-break:break-all;padding:8px;
}
.ph::before{content:"🖼 ";}
.char{position:absolute;display:block;height:520px;aspect-ratio:7/10;object-fit:contain;object-position:bottom;pointer-events:none}

/* ===== 상단 내비 ===== */
.nav{position:absolute;top:12px;left:12px;right:12px;z-index:30;display:flex;justify-content:space-between;pointer-events:none}
.nav button{
  pointer-events:auto;height:34px;padding:0 14px;border-radius:17px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.88);color:var(--navy);box-shadow:0 2px 8px rgba(20,39,90,.12);
  backdrop-filter:blur(6px);transition:transform .1s;
}
.nav button:active{transform:scale(.95)}
.nav.hide{display:none}
.nav .back{font-size:18px;padding:0 14px 2px;line-height:34px}

/* ===== 저장 표시 ===== */
.save{
  position:absolute;left:0;right:0;bottom:8px;z-index:40;text-align:center;
  font-size:11px;color:var(--gray);pointer-events:none;opacity:0;transition:opacity .6s ease;
  text-shadow:0 0 4px #fff,0 0 4px #fff;
}
.save.show{opacity:1;transition:opacity .15s ease}

/* ===== 토스트 ===== */
.toast{
  position:absolute;left:24px;right:24px;bottom:70px;z-index:50;padding:13px 16px;border-radius:14px;
  background:rgba(20,39,90,.94);color:#fff;font-size:14px;font-weight:500;text-align:center;line-height:1.45;
  opacity:0;transform:translateY(24px);transition:opacity .3s,transform .3s;pointer-events:none;
}
.toast.show{opacity:1;transform:none}

/* ===== 말풍선 ===== */
.bubble{
  position:absolute;left:14px;right:14px;bottom:30px;z-index:20;min-height:112px;
  background:#fff;border-radius:22px;padding:30px 20px 24px;
  box-shadow:0 8px 24px rgba(20,39,90,.22);border:2px solid var(--navy-soft);
  cursor:pointer;user-select:none;
}
.bubble .name{
  position:absolute;top:-14px;left:18px;background:var(--pink);color:#fff;font-size:13px;font-weight:700;
  padding:5px 14px;border-radius:14px;box-shadow:0 3px 8px rgba(255,92,147,.4);
}
.bubble .txt{font-size:16px;line-height:1.6;font-weight:500;color:var(--navy);min-height:51px;word-break:keep-all}
.bubble .txt b{color:var(--pink);font-weight:800}
.bubble .arrow{position:absolute;right:16px;bottom:8px;font-size:13px;color:var(--pink);opacity:0}
.bubble.done .arrow{opacity:1;animation:blink 1s infinite}
.bubble.narr{background:rgba(20,39,90,.92);border-color:rgba(255,255,255,.15)}
.bubble.narr .txt{color:#fff}
.bubble.narr .txt b{color:#ffb3cc}
.bubble.narr .arrow{color:#ffb3cc}
.bubble.narr{padding-top:24px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}

/* ===== 공통 버튼 / 카드 ===== */
.btn{
  display:block;width:100%;padding:17px 16px;border-radius:16px;font-size:17px;font-weight:700;
  transition:transform .1s,box-shadow .2s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#ff6b9d,#ff4d85);color:#fff;box-shadow:0 8px 18px rgba(255,92,147,.38)}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 8px 18px rgba(20,39,90,.3)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy-soft);box-shadow:0 4px 12px rgba(20,39,90,.1)}
.card{background:rgba(255,255,255,.94);border-radius:24px;padding:24px 22px;box-shadow:0 10px 30px rgba(20,39,90,.18)}

/* ===== S00 ===== */
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.25) 50%,rgba(255,255,255,.7))}
/* logo.png 는 사방에 투명 여백이 커서(보이는 부분 가로 약 59%) 이미지 박스를 화면보다 넓게 잡아야 크게 보인다. 이미지 자체는 자르거나 변형하지 않음 */
.s00 .logo{position:absolute;top:36px;left:0;right:0;display:flex;justify-content:center}
.s00 .logo img,.s00 .logo .ph{display:block;flex:none;width:130%;height:auto;aspect-ratio:1408/768;object-fit:contain}
.s00 .ask{position:absolute;top:312px;left:0;right:0;text-align:center;font-size:19px;font-weight:700}
.s00 .cards{position:absolute;top:366px;left:18px;right:18px;display:flex;gap:12px}
.pick{
  flex:1;background:rgba(255,255,255,.95);border-radius:22px;overflow:hidden;
  box-shadow:0 10px 26px rgba(20,39,90,.2);border:3px solid transparent;
  transition:transform .15s,border-color .15s;display:flex;flex-direction:column;
}
.pick:hover{border-color:var(--pink);transform:translateY(-4px)}
.pick:active{transform:scale(.97)}
.pick .thumb{height:230px;background:linear-gradient(180deg,var(--pink-soft),#fff);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.pick .thumb img,.pick .thumb .ph{height:225px;width:auto;aspect-ratio:7/10;object-fit:contain;object-position:bottom}
.pick .label{padding:14px 6px 16px;font-size:16px;font-weight:800;color:var(--navy)}
.pick .label small{display:block;font-size:12px;font-weight:600;color:var(--pink);margin-bottom:2px}

/* ===== S02 ===== */
.s02 .q{position:absolute;top:96px;left:24px;right:24px;text-align:center;font-size:27px;font-weight:800;line-height:1.35;text-shadow:0 2px 0 #fff}
.s02 .opts{position:absolute;top:210px;left:24px;right:24px;display:flex;flex-direction:column;gap:12px;z-index:5}

/* ===== S03 ===== */
.s03 .wrap{position:absolute;left:22px;right:22px;top:200px}
.s03 .card h2{font-size:23px;line-height:1.4;font-weight:600;text-align:center;margin-bottom:14px}
.s03 .card h2 b{color:var(--pink);font-weight:900}
.s03 .card p{font-size:15.5px;line-height:1.7;color:#3a4566;text-align:center;word-break:keep-all}
.s03 .badge{display:block;width:max-content;margin:0 auto 14px;background:var(--navy-soft);color:var(--navy);font-weight:700;font-size:12px;padding:5px 12px;border-radius:12px}
.s03 .row{display:flex;gap:12px;margin-top:16px}

/* ===== 계단 도식 (S04, S05 공용) ===== */
.stairs{display:flex;align-items:flex-end;justify-content:center;gap:14px;padding-top:4px}
.stairs .st{flex:1;max-width:84px;display:flex;flex-direction:column;align-items:center}
.stairs .pct{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:3px}
.stairs .bar{width:100%;border-radius:8px 8px 3px 3px;background:var(--navy);transform-origin:bottom;animation:grow .6s ease both}
.stairs .st:nth-child(2) .bar{animation-delay:.12s}
.stairs .st:nth-child(3) .bar{animation-delay:.24s}
.stairs .st.last .bar{background:var(--pink)}
.stairs .st.last .pct{color:var(--pink)}
.stairs .lb{font-size:12px;font-weight:600;color:var(--gray);margin-top:5px}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ===== S04 증권앱 ===== */
.s04{background:#f2f4f8}
.s04 .head{position:absolute;top:0;left:0;right:0;height:108px;background:#fff;padding:56px 20px 0;border-bottom:1px solid var(--line);z-index:2}
.s04 .head .brand{display:block;font-size:12px;font-weight:800;color:var(--pink);letter-spacing:-.2px}
.s04 .head h1{font-size:22px;font-weight:800;margin-top:2px}
.s04 .body{position:absolute;top:108px;left:0;right:0;bottom:176px;overflow-y:auto;padding:14px 16px 16px}
.s04 .box{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,39,90,.06)}
.s04 .p-name{font-size:18px;font-weight:800;margin-bottom:10px}
.s04 .p-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.s04 .p-tags span{background:var(--navy-soft);color:var(--navy);font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px}
.s04 .p-tags span:last-child{background:var(--pink-soft);color:#e0356f}
.s04 .risk{display:inline-block;background:#ffecec;color:#d62b2b;font-size:13px;font-weight:800;padding:5px 12px;border-radius:12px;margin-bottom:12px}
.s04 .p-row{display:flex;gap:10px;font-size:13.5px;border-top:1px solid var(--line);padding-top:12px}
.s04 .p-row .k{color:var(--gray);flex:none;font-weight:600}
.s04 .p-row .v{font-weight:700}
.s04 .box h3{font-size:14px;font-weight:800;margin-bottom:10px}
.s04 .warn{background:#fff4e5;color:#a35a00;font-size:13px;font-weight:700;line-height:1.55;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.s04 .chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 2px;font-size:14.5px;font-weight:600}
.s04 .chk + .chk{border-top:1px solid var(--line)}
.s04 .chk .cb{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid #c9ceda;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:900;transition:all .15s}
.s04 .chk.on .cb{background:var(--navy);border-color:var(--navy)}
.s04 .foot{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#fff;border-top:1px solid var(--line);padding:12px 16px 28px;box-shadow:0 -6px 18px rgba(20,39,90,.06)}
.s04 .amt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.s04 .amt .k{font-size:13px;font-weight:600;color:var(--gray)}
.s04 .amt .v{font-size:22px;font-weight:900;color:var(--navy)}
.s04 .btn{padding:15px 16px}
.s04 .btn:disabled{background:#d5d9e2;color:#fff;box-shadow:none;cursor:not-allowed;transform:none}
.s04 .notice{margin-top:8px;font-size:10px;line-height:1.45;color:var(--gray);text-align:center;word-break:keep-all}
.s04 .done{position:absolute;inset:0;z-index:10;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;pointer-events:none;transition:opacity .25s}
.s04 .done.show{opacity:1;pointer-events:auto}
.s04 .done svg{width:104px;height:104px}
.s04 .done circle{fill:none;stroke:var(--pink);stroke-width:6;stroke-dasharray:289;stroke-dashoffset:289}
.s04 .done path{fill:none;stroke:var(--pink);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
.s04 .done.show circle{animation:draw .6s ease forwards}
.s04 .done.show path{animation:draw .4s .5s ease forwards}
.s04 .done h2{font-size:26px;font-weight:900;opacity:0}
.s04 .done.show h2{animation:inFade .4s .8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ===== S05 앵커 해설 ===== */
.newsbar{position:absolute;top:54px;left:14px;right:14px;z-index:15;background:rgba(20,39,90,.92);color:#fff;font-size:13px;font-weight:700;padding:9px 14px;border-radius:12px;display:flex;align-items:center;gap:8px}
.newsbar::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pink);animation:blink 1.2s infinite}
.stairs-ov{position:absolute;top:100px;left:60px;right:60px;z-index:12;background:rgba(255,255,255,.95);border-radius:16px;padding:10px 14px 10px;box-shadow:0 8px 22px rgba(20,39,90,.25);opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s;pointer-events:none}
.stairs-ov.show{opacity:1;transform:none}
.stairs-ov h4{font-size:11.5px;font-weight:800;color:var(--navy);text-align:center;margin-bottom:4px}
.stairs-ov .stairs .bar{animation:none;transform:scaleY(0)}
.stairs-ov.show .stairs .bar{animation:grow .6s ease both}

/* ===== S06~S08 뉴스 / 그래프 ===== */
.news .bubble{bottom:64px;transition:opacity .3s}
.news .bubble.gone{opacity:0;pointer-events:none}
.news .band{position:absolute;top:54px;left:14px;right:14px;z-index:15;color:#fff;font-size:13.5px;font-weight:800;padding:9px 14px;border-radius:12px;background:#e5253a;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.news .band.blue{background:#1f5fd1}
.ticker{position:absolute;left:0;right:0;bottom:30px;height:28px;z-index:16;background:rgba(10,20,50,.94);display:flex;align-items:center;overflow:hidden}
.ticker .tk-label{flex:none;height:100%;display:flex;align-items:center;padding:0 10px;background:#e5253a;color:#fff;font-size:11px;font-weight:800}
.ticker.blue .tk-label{background:#1f5fd1}
.ticker .tk-view{flex:1;overflow:hidden;white-space:nowrap}
.ticker .tk-run{display:inline-block;animation:tick 22s linear infinite}
.ticker .tk-run span{display:inline-block;padding-right:80px;color:#fff;font-size:12.5px;font-weight:600}
@keyframes tick{to{transform:translateX(-50%)}}

.gcard{position:absolute;top:104px;left:16px;right:16px;z-index:10;background:rgba(255,255,255,.96);border-radius:20px;padding:14px 16px 12px;box-shadow:0 10px 28px rgba(0,0,0,.28);opacity:0;transform:translateY(18px);transition:opacity .4s,transform .4s;pointer-events:none}
.gcard.show{opacity:1;transform:none}
.gcard .gh{position:relative;height:44px}
.gcard .gt{font-size:14px;font-weight:800;line-height:1.35}
.gcard .gt small{display:block;font-size:11px;font-weight:600;color:var(--gray)}
.stamp{position:absolute;top:-26px;right:-6px;display:flex;flex-direction:column;align-items:center;padding:5px 12px 6px;border:3px solid currentColor;border-radius:10px;background:rgba(255,255,255,.92);box-shadow:0 0 0 2px #fff,0 4px 12px rgba(0,0,0,.18);opacity:0;transform:scale(2.4) rotate(-14deg);transition:opacity .15s,transform .28s cubic-bezier(.2,1.7,.4,1)}
.stamp.show{opacity:1;transform:scale(1) rotate(-6deg)}
.stamp b{font-size:18px;font-weight:900;letter-spacing:-.5px;line-height:1.2}
.stamp span{font-size:10.5px;font-weight:700;line-height:1.3}
.stamp.fail{color:#d62b2b}
.stamp.ok{color:#1769d8}
.svgbox{position:relative}
.svgbox svg{display:block;width:100%;height:auto;overflow:visible}
.svgbox .grid{stroke:#e3e6ee;stroke-width:1}
.svgbox .ax{font-size:10.5px;fill:#8a8f99;font-weight:600}
.svgbox .crit{stroke:var(--navy);stroke-width:1.8;stroke-dasharray:6 4}
.svgbox .crit.pass{stroke:#ffb400;stroke-width:3}
.svgbox .cl{font-size:11px;font-weight:800;fill:var(--navy);paint-order:stroke;stroke:#fff;stroke-width:3px}
.svgbox .hl{font-size:13px;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:4px}
.lg{display:flex;justify-content:space-between;gap:4px;margin-top:6px}
.lg .lgi{font-size:11px;font-weight:600;color:#4a5370;white-space:nowrap;padding:3px 6px;border-radius:8px}
.lg .lgi i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.lg .lgi b{font-weight:800}
.lg .lgi.w{background:var(--pink-soft);color:var(--navy);font-weight:800}
.spark{position:absolute;width:0;height:0;pointer-events:none;z-index:5}
.spark b{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;border:3px solid #ffc933;animation:ring .7s ease-out forwards}
.spark i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;background:#ffc933;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk .9s ease-out forwards}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(1.5);opacity:0}}
@keyframes spk{0%{opacity:1;transform:translate(0,0) scale(.3)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.7)}}

.react{position:absolute;left:8px;right:12px;bottom:140px;height:200px;z-index:11;opacity:0;transform:translateY(16px);transition:opacity .4s,transform .4s;pointer-events:none}
.react.show{opacity:1;transform:none}
.react .char{height:200px;left:0;bottom:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.react .mini{position:absolute;left:140px;right:0;top:30px;background:#fff;border-radius:16px;padding:10px 14px 12px;font-size:14.5px;font-weight:600;line-height:1.5;color:var(--navy);box-shadow:0 6px 16px rgba(0,0,0,.25);word-break:keep-all}
.react .mini::before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-left:0;border-right-color:#fff}
.react .mini .nm{display:block;font-size:11px;font-weight:800;color:var(--pink);margin-bottom:1px}
.taphint{position:absolute;left:0;right:0;bottom:72px;z-index:12;margin:0 auto;width:max-content;padding:7px 16px;border-radius:16px;background:rgba(255,255,255,.92);color:var(--navy);font-size:12.5px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .3s}
.taphint.show{opacity:1}
.taphint span{color:var(--pink);display:inline-block;animation:blink 1s infinite}
.nextbtn{position:absolute;left:16px;right:16px;bottom:68px;z-index:12;width:auto;opacity:0;pointer-events:none;transition:opacity .4s}
.nextbtn.show{opacity:1;pointer-events:auto}

/* ===== S09~S11 공통 ===== */
.bubble{transition:opacity .3s}
.bubble.gone{opacity:0;pointer-events:none}
.bgl{position:absolute;inset:0;transition:opacity .5s}
.bgl.off{opacity:0}

/* ===== S09 결과 ===== */
.s09 .char{height:470px;left:50%;margin-left:-164px;bottom:120px;z-index:5}
.s09 .bubble{bottom:74px}
.s09 .rwrap{position:absolute;top:84px;left:18px;right:18px;height:172px;z-index:8}
.s09 .rcard{position:absolute;inset:0;background:rgba(255,255,255,.94);border-radius:22px;padding:14px 18px;box-shadow:0 10px 28px rgba(190,80,120,.25);opacity:0;transform:scale(.95);transition:opacity .45s,transform .45s;text-align:center}
.s09 .rcard.on{opacity:1;transform:none}
.s09 .lbl{font-size:13px;font-weight:700;color:var(--gray)}
.s09 .rate{font-size:54px;font-weight:900;color:var(--pink);line-height:1.15;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.s09 .stats{display:flex;gap:10px;margin-top:6px;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.s09 .stats.in{opacity:1;transform:none}
.s09 .stats div{flex:1;background:var(--pink-soft);border-radius:14px;padding:8px 6px}
.s09 .stats span{display:block;font-size:11.5px;font-weight:700;color:var(--gray)}

/* 이미지: 없으면 회색 플레이스홀더 + 파일명 */
function makeImg(src, cls) {
  const img = new Image();

/* =====================================================================
   말풍선 (타이핑 효과)
   탭 1회: 타이핑 즉시 완료 / 탭 2회: 다음 대사
   ===================================================================== */
function createDialogue(root, lines, opts = {}) {
  const speaker = line => line.who === 'spouse' ? spouse().name : (line.who === 'anchor' ? (CONTENT.ui.anchorName || '') : CONTENT.ui.narrator);
  const bubble = el('div', 'bubble');
  const nameEl = el('div', 'name');
  const txtEl = el('p', 'txt');
  bubble.append(nameEl, txtEl, el('span', 'arrow', '▼'));
  root.appendChild(bubble);

  let i = -1, typing = false, timer = null, segs = [], total = 0, n = 0, dead = false;

  const parse = text => {
    segs = []; total = 0;
    String(text).split(/(\*\*.+?\*\*)/).forEach(p => {
      if (!p) return;
      const bold = /^\*\*.+\*\*$/.test(p);
      const t = bold ? p.slice(2, -2) : p;
      segs.push({ t, bold }); total += t.length;
    });
  };
  const paint = k => {
    let left = k, html = '';
    for (const s of segs) {
      if (left <= 0) break;
      const part = s.t.slice(0, left); left -= part.length;
      const h = esc(part).replace(/\n/g, '<br>');
      html += s.bold ? '<b>' + h + '</b>' : h;
    }
    txtEl.innerHTML = html;
  };
  const finish = () => { clearInterval(timer); typing = false; paint(total); bubble.classList.add('done'); };

  const show = idx => {
    i = idx;
    const line = lines[i];
    const name = speaker(line);
    nameEl.textContent = name;
    nameEl.style.display = name ? '' : 'none';
    bubble.classList.toggle('narr', line.who === 'narr');
    bubble.classList.remove('done');
    parse(pick(line.text));
    n = 0; typing = true; paint(0);
    clearInterval(timer);
    timer = setInterval(() => { n++; paint(n); if (n >= total) finish(); }, 28);
    if (opts.onLine) opts.onLine(line, i);
  };

  const tap = e => {
    if (dead) return;
    e && e.stopPropagation();
    if (typing) { finish(); return; }
    if (i < lines.length - 1) show(i + 1);
    else if (opts.onEnd) opts.onEnd();
  };
  root.addEventListener('click', tap);
  show(0);

  return { bubble, destroy() { dead = true; clearInterval(timer); root.removeEventListener('click', tap); } };
}

const fmtPct = v => (Math.round(v * 10) / 10) + '%';
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

/* year: 몇 년차까지 그릴지(1~3), crit: 그 해의 기준(%), dramatic: 마지막 구간을 극적으로 연출 */
function createChart(year, crit, dramatic) {
  const ch = CONTENT.chart, D = ch.data;
  const W = 326, H = 232, L = 36, R = 312, T = 14, B = 190, N = 3;
  const X = i => L + (R - L) * i / N;
  const Y = v => T + (ch.yMax - v) / (ch.yMax - ch.yMin) * (B - T);
  const keys = ch.series.map(s => s.key);
  const color = Object.fromEntries(ch.series.map(s => [s.key, s.color]));
  // 이번 시점에서 가장 많이 떨어진 지수(최저) = 굵게 강조
  const worst = keys.reduce((a, k) => D[k][year] < D[a][year] ? k : a, keys[0]);
  const order = keys.filter(k => k !== worst).concat(worst);

  let svg = `<svg viewBox="0 0 ${W} ${H}">`;
  ch.gridLines.forEach(g => {
    svg += `<line class="grid" x1="${L}" x2="${R}" y1="${Y(g)}" y2="${Y(g)}"/>` +
           `<text class="ax" x="${L - 6}" y="${Y(g) + 4}" text-anchor="end">${g}%</text>`;
  });
  ch.xLabels.forEach((t, i) => { svg += `<text class="ax" x="${X(i)}" y="${B + 22}" text-anchor="middle">${esc(t)}</text>`; });
  svg += `<line class="crit" x1="${L}" x2="${R}" y1="${Y(crit)}" y2="${Y(crit)}"/>` +
         `<text class="cl" x="${L + 4}" y="${Y(crit) - 6}">${esc(ch.criterionLabel)} ${crit}%</text>`;
  order.forEach(k => {
    const w = k === worst;
    svg += `<polyline class="ln" data-k="${k}" fill="none" stroke="${color[k]}" stroke-width="${w ? 4.5 : 2.4}" stroke-linecap="round" stroke-linejoin="round"/>` +
           `<circle class="hd" data-k="${k}" cx="-30" cy="-30" r="${w ? 6 : 3.8}" fill="${color[k]}" stroke="#fff" stroke-width="2"/>`;
  });
  svg += `<text class="hl" fill="${color[worst]}" text-anchor="middle" x="-60" y="-60"></text></svg>`;

  const wrap = el('div', 'chart');
  const box = el('div', 'svgbox', svg);
  const lg = el('div', 'lg', ch.series.map(s =>
    `<span class="lgi${s.key === worst ? ' w' : ''}"><i style="background:${s.color}"></i>${esc(s.name)} <b></b></span>`).join(''));
  wrap.append(box, lg);

  const ln = {}, hd = {};
  keys.forEach(k => { ln[k] = box.querySelector(`.ln[data-k="${k}"]`); hd[k] = box.querySelector(`.hd[data-k="${k}"]`); });
  const critLine = box.querySelector('.crit'), hl = box.querySelector('.hl');

  // k 지수를 upto 번째 점까지 그린 뒤 head(진행 중인 끝점)를 이어 붙인다
  const draw = (k, upto, head) => {
    const pts = D[k].slice(0, upto + 1).map((v, i) => [X(i), Y(v)]);
    const val = head ? head.v : D[k][upto];
    if (head) pts.push([head.x, Y(head.v)]);
    ln[k].setAttribute('points', pts.map(p => p.join(',')).join(' '));
    const last = pts[pts.length - 1];
    hd[k].setAttribute('cx', last[0]); hd[k].setAttribute('cy', last[1]);
    if (k === worst) {
      hl.setAttribute('x', Math.min(W - 22, Math.max(22, last[0])));
      hl.setAttribute('y', last[1] - 12);
      hl.textContent = fmtPct(val);
    }
  };

  const spark = (x, y) => {
    const s = el('div', 'spark');
    s.style.left = (x / W * 100) + '%'; s.style.top = (y / H * 100) + '%';
    s.appendChild(el('b'));
    for (let i = 0; i < 10; i++) {
      const a = Math.PI * 2 * i / 10, r = 30 + (i % 2) * 14, st = el('i');
      st.style.setProperty('--dx', Math.cos(a) * r + 'px');
      st.style.setProperty('--dy', Math.sin(a) * r + 'px');
      s.appendChild(st);
    }
    box.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  };

  let raf = 0, tm = 0;
  const run = (dur, step, done) => {
    const t0 = performance.now();
    const tick = now => {
      const t = Math.min((now - t0) / 1000, dur);
      step(t);
      if (t < dur) raf = requestAnimationFrame(tick); else if (done) done();
    };
    raf = requestAnimationFrame(tick);
  };

  // a~b년 구간을 모든 선이 함께 그려진다
  const stage = (a, b, dur, done) => run(dur, t => {
    const s = a + (b - a) * ease(t / dur);
    let i = Math.floor(s); if (i >= b) i = b - 1;
    const f = s - i;
    keys.forEach(k => draw(k, i, { x: X(i + f), v: D[k][i] + (D[k][i + 1] - D[k][i]) * f }));
  }, done);

  // 마지막 구간: 최저 지수가 기준선 바로 아래에서 멈칫했다가 넘어간다
  const special = done => {
    const a = D[worst][year - 1], b = D[worst][year];
    const h1 = crit - 0.6, h2 = crit - 0.15, T1 = 1.7, T2 = 2.7, T3 = 3.3;
    const val = t => t < T1 ? a + (h1 - a) * easeOut(t / T1)
                   : t < T2 ? h1 + (h2 - h1) * ((t - T1) / (T2 - T1))
                   : h2 + (b - h2) * ease((t - T2) / (T3 - T2));
    let fired = false;
    run(T3, t => {
      keys.forEach(k => {
        if (k === worst) {
          const v = val(t);
          draw(k, year - 1, { x: X(year - 1) + (X(year) - X(year - 1)) * (v - a) / (b - a), v });
          if (!fired && v >= crit) { fired = true; critLine.classList.add('pass'); spark(X(year - 1) + (X(year) - X(year - 1)) * (crit - a) / (b - a), Y(crit)); }
        } else {
          const f = ease(Math.min(t / 2.2, 1));
          draw(k, year - 1, { x: X(year - 1) + (X(year) - X(year - 1)) * f, v: D[k][year - 1] + (D[k][year] - D[k][year - 1]) * f });
        }
      });
    }, done);
  };

  const fillLegend = () => lg.querySelectorAll('.lgi').forEach((e, i) => { e.querySelector('b').textContent = fmtPct(D[keys[i]][year]); });

  let finished = false, onFinish = null;
  const finish = () => { if (finished) return; finished = true; fillLegend(); if (onFinish) onFinish(); };

  return {
    el: wrap,
    // 카드가 나타난 뒤(0.35초) 선이 그려지기 시작한다. 끝나면 cb 호출
    play(cb) {
      onFinish = cb;
      tm = setTimeout(() => {
        if (dramatic) stage(0, year - 1, 1.6, () => { tm = setTimeout(() => special(finish), 450); });
        else stage(0, year, 1 + 0.45 * year, finish);
      }, 350);
    },
    // 그리는 도중 탭하면 애니메이션을 건너뛰고 완성 상태로
    skip() {
      if (finished) return;
      cancelAnimationFrame(raf); clearTimeout(tm);
      keys.forEach(k => draw(k, year - 1, { x: X(year), v: D[k][year] }));
      if (dramatic) critLine.classList.add('pass');
      finish();
    },
    stop() { cancelAnimationFrame(raf); clearTimeout(tm); }
  };
}

function buildNews(root, id) {
  const C = CONTENT[id], CH = CONTENT.chart;
  root.classList.add('news');
  root.appendChild(bgImg(C.bg));
  root.appendChild(el('div', 'band ' + C.bandKind, esc(C.band)));

  const t = esc(C.ticker);
  root.appendChild(el('div', 'ticker ' + C.bandKind,
    `<div class="tk-label">${esc(CH.tickerLabel)}</div><div class="tk-view"><div class="tk-run"><span>${t}</span><span>${t}</span></div></div>`));

  const chart = createChart(C.year, C.criterion, !!C.dramatic);
  const card = el('div', 'gcard');
  const head = el('div', 'gh', `<div class="gt">${esc(CH.title)}<small>${esc(CH.subtitle)}</small></div>`);
  const stamp = el('div', 'stamp ' + C.stamp.kind, `<b>${esc(C.stamp.text)}</b><span>${esc(C.stamp.sub)}</span>`);
  head.appendChild(stamp);
  card.append(head, chart.el);
  root.appendChild(card);

  const react = el('div', 'react');
  react.appendChild(spouseImg(C.spouse.mood, 'char'));
  react.appendChild(el('div', 'mini', `<span class="nm">${esc(spouse().name)}</span>${esc(C.spouse.text)}`));
  root.appendChild(react);

  const next = el('button', 'btn primary nextbtn', esc(C.next));
  next.onclick = e => { e.stopPropagation(); go(C.nextId); };
  root.appendChild(next);

  const hint = el('div', 'taphint', `${esc(CONTENT.ui.tapHint)} <span>▼</span>`);
  root.appendChild(hint);

  // 대사가 끝난 뒤 탭할 때마다 한 단계씩:
  //   1탭 그래프 등장(그리는 중 탭하면 건너뛰기) → 2탭 도장 → 3탭 배우자 반응 + [다음] 버튼
  let step = 0, animating = false;
  const advance = () => {
    if (animating) { chart.skip(); return; }
    if (step === 0) {
      step = 1; animating = true;
      hint.classList.remove('show');
      root.querySelector('.bubble').classList.add('gone');
      card.classList.add('show');
      chart.play(() => { animating = false; hint.classList.add('show'); });
    } else if (step === 1) {
      step = 2;
      stamp.classList.add('show');
    } else if (step === 2) {
      step = 3;
      react.classList.add('show');
      next.classList.add('show');
      hint.classList.remove('show');
    }
  };
  const d = createDialogue(root, C.lines, { onEnd: advance });
  return () => { d.destroy(); chart.stop(); };
}

/* =====================================================================
   화면 전환 / 내비게이션 / 해시
   ===================================================================== */
const stage = $('stage');
let cur = null, curEl = null, curCleanup = null, hist = [];

function go(id, opt = {}) {
  if (!SCREENS[id]) id = 'S00';
  const dir = opt.dir || 'fwd';

  if (cur && !opt.noPush && !opt.replace) hist.push(cur);

  const old = curEl;
  if (curCleanup) { curCleanup(); curCleanup = null; }

  const root = el('div', 'screen');
  stage.appendChild(root);
  curCleanup = SCREENS[id].build(root) || null;

  if (old) {
    old.classList.add('out');
    setTimeout(() => old.remove(), 360);
  }
  if (opt.first) root.classList.add('no-anim');
  else root.classList.add(dir === 'back' ? 'in-back' : 'in-fwd');

  cur = id; curEl = root;
  $('nav').classList.toggle('hide', SCREENS[id].nav === false);
  history.replaceState(null, '', '#' + id);
  if (!opt.first) flashSave();
}

function goBack() {
  if (!hist.length) return;
  go(hist.pop(), { dir: 'back', noPush: true });
}
function goHome() { hist = []; go('S00', { dir: 'back', noPush: true }); }

$('btnBack').textContent = CONTENT.ui.back;
$('btnHome').textContent = CONTENT.ui.home;
$('btnBack').onclick = goBack;
$('btnHome').onclick = goHome;

window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1).toUpperCase();
  if (id && id !== cur) go(id);
});

/* 폰 프레임을 화면 높이에 맞춰 축소 (PC) */
function fit() {
  const p = $('phone');
  if (window.innerWidth <= 430) { p.style.transform = ''; return; }
  const s = Math.min(1, (window.innerHeight - 24) / 864, (window.innerWidth - 24) / 410);
  p.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit);
